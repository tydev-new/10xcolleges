app = "10xcolleges-scorecard"
primary_region = "iad"

[build]

[env]
  SUPABASE_URL = "https://ttwhdoyagmxplflgicpb.supabase.co"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[mounts]
  source = "feedback"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
